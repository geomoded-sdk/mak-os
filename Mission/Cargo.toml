[package]
name = "mak-mission"
version = "0.1.0"
edition = "2021"
description = "Mak OS — Mission Control e Spaces (visão geral de janelas e áreas de trabalho)"
license = "GPL-3.0"

[dependencies]
gtk = { package = "gtk4", version = "0.8" }
gtk4-layer-shell = "0.3"
glib = "0.19"
gio = "0.19"
wayland-client = "0.31"
wayland-backend = "0.3"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[[bin]]
name = "mak-mission"
path = "src/main.rs"
