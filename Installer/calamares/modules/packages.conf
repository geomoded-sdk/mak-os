---
# =============================================================================
#  Calamares — módulo packages do Mak OS
#  Instala os pacotes essenciais dentro do sistema recém-instalado.
# =============================================================================
operations:
  - install:
      - mak-os-desktop
      - mak-os-apps
      - mak-os-themes
      - mak-os-kernel
      - labwc
      - pipewire
      - pipewire-pulse
      - wireplumber
      - network-manager
      - bluez
      - upower
      - flatpak
      - xdg-desktop-portal
      - xdg-desktop-portal-gtk
      - calamares

# Opcional: remover pacotes não necessários
# - remove:
#     - gnome-shell
#     - gdm3
