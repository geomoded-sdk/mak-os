---
# =============================================================================
#  Calamares — módulo packages do Pineapple OS
#  Instala os pacotes essenciais dentro do sistema recém-instalado.
# =============================================================================
operations:
  - install:
      - labwc
  - python3
  - python3-gi
  - python3-cairo
  - gir1.2-gtk-4.0
  - gir1.2-gstreamer-1.0
  - gir1.2-webkit-6.0
  - libgtk-4-1
  - libadwaita-1-0
      - pipewire
      - pipewire-pulse
      - wireplumber
      - network-manager
      - bluez
      - upower
      - flatpak
      - xdg-desktop-portal
      - xdg-desktop-portal-gtk
  - xdg-desktop-portal-wlr
  - fuse3
  - udisks2
  - apparmor

# Opcional: remover pacotes não necessários
# - remove:
#     - gnome-shell
#     - gdm3
