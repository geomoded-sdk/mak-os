---
# =============================================================================
#  Calamares — shellprocess pós-instalação do Mak OS
#  Roda comandos dentro do sistema instalado (chroot).
# =============================================================================
script:
  - name: configure-makos
    command: |
      set -e
      # Ativa os serviços do Mak OS
      systemctl enable makos-session.target
      systemctl enable NetworkManager
      systemctl enable bluetooth
      systemctl enable pipewire
      systemctl enable upower

      # Aplica o tema e os ícones por padrão
      glib-compile-schemas /usr/share/glib-2.0/schemas
      gtk-update-icon-cache -f /usr/share/icons/mak-icons || true

      # Registra a versão instalada
      echo "0.1.0" > /etc/makos-version

      # Habilita Flatpak para o usuário criado pelo instalador
      if [ -d /home ]; then
        flatpak remote-add --if-not-exists --system flathub \
          https://dl.flathub.org/repo/flathub.flatpakrepo || true
      fi
    timeout: 60000
