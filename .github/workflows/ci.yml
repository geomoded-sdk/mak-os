name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-tests:
    name: Testes Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Instalar dependências de teste
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-gi gir1.2-gtk-4.0
          python3 -m compileall Apps AI

      - name: Rodar testes
        run: python3 -m unittest discover -s tests -v

  rust-shell:
    name: Rust (shell/dock/launcher/launchpad/finder/gestures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Instalar dependências GTK
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev libadwaita-1-dev libwayland-dev wayland-protocols \
            gobject-introspection libgirepository1.0-dev \
            libinput-dev libudev-dev \
            meson ninja-build pkg-config
          # gtk4-layer-shell não é empacotado no Ubuntu 24.04; compilar da fonte
          git clone --depth 1 https://github.com/wmww/gtk4-layer-shell.git /tmp/gtk4-layer-shell
          meson setup /tmp/gtk4-layer-shell/build /tmp/gtk4-layer-shell -Dvapi=false
          ninja -C /tmp/gtk4-layer-shell/build
          sudo ninja -C /tmp/gtk4-layer-shell/build install
          sudo ldconfig

      - name: Verificar formatação
        run: |
          cargo fmt --manifest-path Desktop/Cargo.toml -- --check || true
          cargo fmt --manifest-path Dock/Cargo.toml -- --check || true
          cargo fmt --manifest-path Launcher/Cargo.toml -- --check || true
          cargo fmt --manifest-path Launchpad/Cargo.toml -- --check || true
          cargo fmt --manifest-path Finder/Cargo.toml -- --check || true
          cargo fmt --manifest-path Gestures/Cargo.toml -- --check || true

      - name: Build (check sem compilar binários nativos)
        run: |
          for crate in Desktop Dock Launcher Launchpad Finder Gestures; do
            cargo check --manifest-path $crate/Cargo.toml
          done

  shell-scripts:
    name: Scripts shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validar sintaxe dos scripts
        run: |
          fail=0
          while IFS= read -r f; do
            if ! bash -n "$f"; then
              echo "ERRO de sintaxe: $f"
              fail=1
            else
              echo "OK: $f"
            fi
          done < <(git ls-files '*.sh')
          [ "$fail" -eq 0 ] || exit 1

  icons:
    name: Geração de ícones
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Gerar ícones e validar XML
        run: |
          python3 Scripts/gen-icons.py
          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob("Icons/mak-icons/**/*.svg", recursive=True):
              ET.parse(f)
          print("todos os SVGs válidos")
          EOF
