name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  python-tests:
    name: Testes Python
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Instalar dependências de teste
        run: |
          bash Scripts/ci-apt.sh \
            python3 python3-gi python3-cairo \
            gir1.2-gtk-4.0 gir1.2-gstreamer-1.0 \
            gir1.2-gst-plugins-base-1.0

      - name: Verificar sintaxe Python
        run: |
          python3 -m compileall Apps AI Compatibility Installer

      - name: Rodar testes
        run: |
          python3 -m unittest discover -s tests -v

  rust-shell:
    name: Rust (shell/dock/launcher/launchpad/mission/canopy/gestures)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Instalar dependências GTK
        run: |
          bash Scripts/ci-apt.sh \
            libgtk-4-dev libadwaita-1-dev libwayland-dev \
            wayland-protocols libxkbcommon-dev gobject-introspection \
            libgirepository1.0-dev libinput-dev libudev-dev \
            meson ninja-build pkg-config

      - name: Compilar gtk4-layer-shell
        run: |
          git clone --depth 1 \
            https://github.com/wmww/gtk4-layer-shell.git \
            /tmp/gtk4-layer-shell

          meson setup \
            /tmp/gtk4-layer-shell/build \
            /tmp/gtk4-layer-shell \
            -Dvapi=false

          ninja -C /tmp/gtk4-layer-shell/build
          sudo ninja -C /tmp/gtk4-layer-shell/build install
          sudo ldconfig

      - name: Instalar Rust
        run: |
          rustup update stable
          rustup default stable

      - name: Verificar formatação
        run: |
          failed=0
          for crate in Desktop Dock Launcher Launchpad Mission Canopy Gestures; do
            echo "==> fmt: $crate"
            cargo fmt \
              --manifest-path "$crate/Cargo.toml" \
              -- \
              --check || failed=1
          done
          exit $failed

      - name: Verificar crates
        run: |
          failed=0
          for crate in Desktop Dock Launcher Launchpad Mission Canopy Gestures; do
            echo "==> check: $crate"
            cargo check \
              --manifest-path "$crate/Cargo.toml" || failed=1
          done
          exit $failed

  shell-scripts:
    name: Scripts shell
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validar sintaxe dos scripts
        shell: bash
        run: |
          fail=0

          while IFS= read -r f; do
            if ! bash -n "$f"; then
              echo "ERRO de sintaxe: $f"
              fail=1
            else
              echo "OK: $f"
            fi
          done < <(git ls-files '*.sh' '*.hook.chroot')

          exit "$fail"

  icons:
    name: Geração de ícones
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Instalar Python
        run: |
          bash Scripts/ci-apt.sh python3

      - name: Gerar ícones
        run: |
          python3 Scripts/gen-icons.py

      - name: Validar SVGs
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          files = glob.glob(
              "Icons/pineapple-icons/**/*.svg",
              recursive=True
          )

          if not files:
              raise SystemExit("Nenhum SVG encontrado")

          for f in files:
              ET.parse(f)
              print(f"OK: {f}")

          print(f"{len(files)} SVG(s) válidos")
          PY

  kernel-build:
    name: Compilar kernel 6.1-pineappleos + LPNU
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Instalar dependências de compilação
        run: |
          bash Scripts/ci-apt.sh \
            build-essential libncurses-dev bison flex libssl-dev \
            libelf-dev dwarves bc cpio zstd wget curl kmod \
            initramfs-tools busybox

      - name: Compilar kernel + LPNU
        env:
          KERNEL_BUILD_OUT: ${{ github.workspace }}/kernel-dist
        run: |
          chmod +x Scripts/build-kernel.sh
          ./Scripts/build-kernel.sh

      - name: Publicar kernel
        uses: actions/upload-artifact@v4
        with:
          name: pineappleos-kernel-6.1-lpnu
          path: kernel-dist
          if-no-files-found: error

  iso-build:
    name: ISO x64 (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Instalar dependências do build
        run: |
          bash Scripts/ci-apt.sh \
            live-build debootstrap debian-archive-keyring \
            devscripts curl xorriso grub-pc-bin \
            grub-efi-amd64-bin mtools squashfs-tools

      - name: Verificar Python
        run: |
          python3 -m compileall Apps AI Compatibility Installer

      - name: Gerar assets
        run: |
          python3 Scripts/gen-icons.py
          python3 Scripts/gen-backgrounds.py
          python3 Scripts/gen-catalina.py

      - name: Compilar ISO amd64
        env:
          POWERBOOK_ID: ${{ secrets.POWERBOOK_ID }}
        run: |
          chmod +x Scripts/build-iso.sh
          sudo -E ./Scripts/build-iso.sh

      - name: Publicar ISO
        uses: actions/upload-artifact@v4
        with:
          name: pineappleos-amd64-iso
          path: pineappleos-*.iso
          if-no-files-found: error

      - name: Instalar ferramentas de validação/boot
        run: |
          bash Scripts/ci-apt.sh \
            qemu-system-x86 ovmf python3

      - name: Validar estrutura da ISO (espelho do Rufus)
        run: |
          ISO="$(ls pineappleos-*amd64.iso | head -n1)"
          echo "Validando: $ISO"
          python3 Scripts/iso-inspect.py "$ISO"

      - name: Boot test QEMU (BIOS + UEFI)
        run: |
          ISO="$(ls pineappleos-*amd64.iso | head -n1)"
          GRAPHICAL=1 BOOT_TIMEOUT=900 bash Scripts/boot-test-iso.sh "$ISO"