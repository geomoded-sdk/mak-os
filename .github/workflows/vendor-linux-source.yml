name: Vendor Linux source

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão da árvore Linux a baixar"
        required: true
        default: "6.1"

permissions:
  contents: write

jobs:
  vendor:
    name: Baixar e versionar árvore Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Baixar fonte oficial
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          case "$VERSION" in
            6.1) URL="https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.1.tar.xz" ;;
            *) echo "Versão não permitida neste workflow: $VERSION" >&2; exit 2 ;;
          esac
          curl --fail --location --retry 3 "$URL" -o /tmp/linux.tar.xz
          tar -xJf /tmp/linux.tar.xz -C Kernel
          test -f "Kernel/linux-$VERSION/Makefile"

      - name: Commit da árvore extraída
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "Kernel/linux-$VERSION"
          if git diff --cached --quiet; then
            echo "A árvore já está versionada e sem mudanças."
            exit 0
          fi
          git commit -m "vendor: add extracted Linux $VERSION source"
          git push origin HEAD:${GITHUB_REF_NAME}
