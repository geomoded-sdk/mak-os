[package]
name = "pineapple-dock"
version = "0.1.0"
edition = "2021"
description = "Pineapple OS — dock inferior com animações"
license = "GPL-3.0"

[dependencies]
gtk = { package = "gtk4", version = "0.8" }
gtk4-layer-shell = "0.3"
glib = "0.19"
gio = "0.19"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[[bin]]
name = "pineapple-dock"
path = "src/main.rs"
