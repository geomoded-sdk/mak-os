<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101820"/>
      <stop offset="0.5" stop-color="#16232e"/>
      <stop offset="1" stop-color="#1d2a38"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.2" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f9dde" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#e2776f" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f9dde"/>
      <stop offset="1" stop-color="#e2776f"/>
    </linearGradient>
  </defs>

  <rect width="2560" height="1440" fill="url(#bg)"/>

  <!-- orbes de luz -->
  <ellipse cx="1860" cy="380" rx="720" ry="520" fill="url(#glow)" opacity="0.7"/>
  <ellipse cx="760" cy="1120" rx="620" ry="460" fill="url(#glow)" opacity="0.45"/>

  <!-- grade geométrica sutil -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="360" x2="2560" y2="360"/>
    <line x1="0" y1="720" x2="2560" y2="720"/>
    <line x1="0" y1="1080" x2="2560" y2="1080"/>
    <line x1="640" y1="0" x2="640" y2="1440"/>
    <line x1="1280" y1="0" x2="1280" y2="1440"/>
    <line x1="1920" y1="0" x2="1920" y2="1440"/>
  </g>

  <!-- marca "M" abstrata do Mak OS -->
  <g transform="translate(1280 720)">
    <circle r="230" fill="none" stroke="url(#core)" stroke-width="2.5" opacity="0.9"/>
    <circle r="180" fill="none" stroke="url(#core)" stroke-width="1.5" opacity="0.5"/>
    <path d="M -60 -110 L -60 110" stroke="url(#core)" stroke-width="14" stroke-linecap="round"/>
    <path d="M 60 -110 L 60 110" stroke="url(#core)" stroke-width="14" stroke-linecap="round"/>
    <path d="M -60 -110 L 0 -30 L 60 -110" fill="none" stroke="url(#core)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M -60 110 L 0 30 L 60 110" fill="none" stroke="url(#core)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
